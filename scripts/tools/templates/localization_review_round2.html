<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>哥布林教你地下城 · 第二轮中英文实机审阅</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;color:#e9e3cd;background:#0e1513}*{box-sizing:border-box}body{margin:0}header{padding:36px max(24px,4vw) 24px;border-bottom:1px solid #3c483d;background:linear-gradient(125deg,#26382c,#131b17)}small,.muted{color:#a6b5a6}h1{font-size:28px;letter-spacing:1px;margin:8px 0 14px}p{line-height:1.8;margin:5px 0}.badge{font-size:12px;color:#d9b676;letter-spacing:2px}.stats{display:flex;gap:28px;margin-top:20px;flex-wrap:wrap}.stats b{font-size:26px;color:#e5c887;margin-right:6px}.toolbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;padding:14px max(24px,4vw);background:#14201bf5;border-bottom:1px solid #3d4a3d}button,select,input,textarea{font:inherit;color:inherit;background:#1e2d24;border:1px solid #54644e;border-radius:4px;padding:9px 12px}button{cursor:pointer}button:hover,button.active{background:#384b32;border-color:#c6aa69}input{flex:1;min-width:210px}main{padding:24px max(24px,4vw) 50px}.screen{margin:0 0 28px;background:#17211c;border:1px solid #394a39;border-radius:7px;overflow:hidden}.heading{padding:14px 18px;display:flex;gap:16px;justify-content:space-between;align-items:center}.heading h2{font-size:17px;margin:0}.heading small{font-size:11px;display:block;margin-top:4px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#526346}.pane{position:relative;background:#080d0b}.pane img{width:100%;display:block;cursor:zoom-in;aspect-ratio:16/9}.lang{position:absolute;left:12px;top:10px;background:#0d1713dc;border:1px solid #5b674e;border-radius:3px;padding:3px 8px;font-size:12px;color:#e7cc8e;pointer-events:none}.stage{padding:8px 18px;font-size:13px;background:#25352a;border-top:1px solid #48593e}.stage.before{background:#292e29;color:#b8bcae}.resolution{padding:12px 18px;background:#1d2b21;border-top:1px solid #394a39;font-size:14px;line-height:1.8}.resolution strong{color:#d9bd7f}.feedback{display:flex;gap:12px;padding:12px 18px}.feedback input{font-size:13px;min-width:100px}.feedback select{font-size:13px}.one .pair{grid-template-columns:1fr}.pager{display:flex;justify-content:center;gap:18px;align-items:center;padding:10px 0 25px}.empty{text-align:center;padding:55px}.textrow{display:grid;grid-template-columns:1fr 1fr;border:1px solid #394a39;margin-bottom:12px;border-radius:4px}.key{grid-column:1/-1;background:#25392a;padding:8px 14px;font:12px ui-monospace,monospace;color:#d9c08d}.copy{padding:14px;white-space:pre-wrap;line-height:1.65;font-size:14px;overflow-wrap:anywhere}.copy+.copy{border-left:1px solid #394a39}dialog{width:96vw;max-width:1500px;background:#0b100e;color:inherit;border:1px solid #819369;padding:12px}dialog::backdrop{background:#000d}dialog img{width:100%;display:block;max-height:80vh;object-fit:contain}dialog nav{display:flex;align-items:center;gap:12px;padding:10px;flex-wrap:wrap}.grow{flex:1}.info{font-size:13px;color:#b6c1ad;margin-bottom:18px}button:disabled{opacity:.4;cursor:default}.carried{padding:10px 18px;font-size:12px;color:#a6b5a6}@media(max-width:800px){.pair{grid-template-columns:1fr}.heading{align-items:flex-start}.feedback{flex-wrap:wrap}.textrow{grid-template-columns:1fr}.key{grid-column:auto}.copy+.copy{border-left:0;border-top:1px solid #394a39}h1{font-size:23px}.stats{gap:18px}.stats b{font-size:22px}}
</style>
<header><div class="badge">GOBLIN'S GUIDE TO DUNGEONS · LOCALIZATION REVIEW · ROUND 02</div>
<h1>第二轮 · 中英文实机对比审阅</h1>
<p>按首轮 9 项意见修改。默认逐项展示原图与新图，左右分别为中文和英文；点击图片可放大并切换版本。</p>
<p class="muted">原审阅意见和截图已保留。本轮意见独立保存；其余未提意见的项目沿用首轮结论，可在“全部界面”中查看。新图由 Godot 实机渲染，使用临时演示进度。</p>
<div class="stats" id="stats"></div></header>
<div class="toolbar">
<button id="screensTab" class="active">实机截图</button><button id="textTab">全部文案</button>
<select id="scope" aria-label="审阅范围"><option value="primary">9 项修改意见</option><option value="related">修改及关联界面</option><option value="all">全部界面</option></select>
<select id="category" aria-label="界面分类"><option value="">全部类别</option></select>
<select id="comparison" aria-label="对比方式"><option value="compare">修改前后对比</option><option value="after">只看修改后</option></select>
<select id="language" aria-label="截图语言"><option value="both">中英文对照</option><option value="zh_CN">只看中文</option><option value="en">只看英文</option></select>
<input id="search" type="search" placeholder="搜索页面、物品、文案或 key" aria-label="搜索">
<button id="export">导出二次审阅意见</button></div>
<main><div class="info" id="info"></div><div id="items"></div><div class="pager"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div></main>
<dialog id="zoom"><nav><strong id="zoomTitle"></strong><span class="grow"></span><button id="zoomBefore">修改前</button><button id="zoomAfter">修改后</button><button id="zoomZh">中文</button><button id="zoomEn">English</button><button id="closeZoom">关闭 ×</button></nav><img id="zoomImg" alt="实机截图原图"></dialog>
<script type="application/json" id="data">__REVIEW_DATA__</script>
<script>
const data=JSON.parse(document.querySelector('#data').textContent),$=s=>document.querySelector(s);
const names={menus:'主菜单与设置',camp:'营地与天赋',battle:'战斗与背包',stats:'全部属性说明',bank:'银行与交易操作',trades:'哥布林交易、借贷与挑战',settlement:'结算',relics:'全部遗物',weapons:'全部武器',enchantments:'全部附魔'};
const storageKey=data.review.storage_key,order=Object.keys(names);
let mode='screens',page=0,filtered=[],zoomEntry=null,zoomLang='zh_CN',zoomStage='after',notes={};
try{notes=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch{}
data.screens.sort((a,b)=>order.indexOf(a.category)-order.indexOf(b.category));
for(const key of order){const count=data.screens.filter(x=>x.category===key).length;if(count)$('#category').add(new Option(`${names[key]} (${count})`,key))}
const beforeCount=data.screens.reduce((sum,e)=>sum+Object.keys(e.before||{}).length,0);
$('#stats').innerHTML=`<span><b>${data.review.feedback_count}</b>项修改</span><span><b>${data.screens.length*2}</b>张新截图</span><span><b>${beforeCount}</b>张原图</span><span><b>${data.messages.length}</b>条中英文文案</span>`;
function save(){try{localStorage.setItem(storageKey,JSON.stringify(notes))}catch{ $('#info').textContent='浏览器无法保存意见，请及时导出。' }}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function showZoom(entry,lang,stage='after'){
  zoomEntry=entry;zoomLang=lang;zoomStage=stage;
  if(stage==='before'&&!entry.before?.[lang])zoomStage='after';
  const shot=zoomStage==='before'?entry.before[lang]:entry[lang];
  $('#zoomTitle').textContent=entry.title+' · '+(zoomStage==='before'?'修改前':'修改后')+' · '+(lang==='en'?'English':'中文');
  $('#zoomImg').src=shot.file;
  $('#zoomZh').classList.toggle('active',lang==='zh_CN');$('#zoomEn').classList.toggle('active',lang==='en');
  $('#zoomBefore').classList.toggle('active',zoomStage==='before');$('#zoomAfter').classList.toggle('active',zoomStage==='after');
  $('#zoomBefore').disabled=!entry.before?.[lang];
  if(!$('#zoom').open)$('#zoom').showModal();
}
function addPair(card,entry,stage,lang){
  const before=stage==='before',shots=before?entry.before:entry;
  card.append(el('div','stage'+(before?' before':''),before?'修改前 · 首轮原图':'修改后 · 本轮实机'));
  const pair=el('div','pair');
  for(const locale of (lang==='both'?['zh_CN','en']:[lang])){
    const pane=el('div','pane'),img=el('img');img.loading='lazy';img.src=shots[locale].thumbnail;
    img.alt=entry.title+' · '+(before?'修改前':'修改后')+' · '+locale;
    img.onclick=()=>showZoom(entry,locale,stage);
    pane.append(img,el('span','lang',locale==='en'?'English':'中文'));pair.append(pane);
  }
  card.append(pair);
}
function render(){
  const q=$('#search').value.toLowerCase(),cat=$('#category').value,lang=$('#language').value,scope=$('#scope').value;
  filtered=(mode==='screens'?data.screens:data.messages).filter(e=>{
    if(mode==='screens'){
      if(cat&&cat!==e.category)return false;
      if(scope==='primary'&&e.review_scope!=='primary')return false;
      if(scope==='related'&&e.review_scope==='accepted')return false;
    }
    return !q||JSON.stringify(e).toLowerCase().includes(q);
  });
  const size=mode==='screens'?9:40,pages=Math.max(1,Math.ceil(filtered.length/size));page=Math.min(page,pages-1);
  $('#items').replaceChildren();
  $('#info').textContent=mode==='screens'?`当前 ${filtered.length} 组。修改意见、处理结果与原图一起展示；二次意见独立保存，导出时文件名含 round2。`:`完整的 ${data.messages.length} 条翻译供检索；已更新侵蚀度说明。`;
  for(const entry of filtered.slice(page*size,(page+1)*size)){
    if(mode==='text'){
      const card=el('div','textrow');card.append(el('div','key',entry.keys),el('div','copy',entry.zh_CN),el('div','copy',entry.en));$('#items').append(card);continue;
    }
    const card=el('article','screen'+(lang==='both'?'':' one')),head=el('div','heading'),title=el('div');
    title.append(el('h2','',entry.title),el('small','',entry.id));
    head.append(title,el('small','',(names[entry.category]||entry.category)+(entry.review_scope==='related'?' · 关联验证':'')));card.append(head);
    if(entry.feedback){
      const resolution=el('div','resolution'),request=el('p'),result=el('p');
      request.append(el('strong','',entry.review_scope==='primary'?'首轮意见：':'关联意见：'),document.createTextNode(entry.feedback));
      result.append(el('strong','','已处理：'),document.createTextNode(entry.resolution));resolution.append(request,result);
      if(entry.review_scope==='primary'&&data.screens.some(e=>e.review_scope==='related'&&e.feedback_source===entry.id)){
        const linked=el('button','','查看此项的关联界面');linked.onclick=()=>{$('#scope').value='related';$('#category').value='';$('#search').value=entry.id;page=0;render();window.scrollTo(0,150)};resolution.append(linked);
      }
      card.append(resolution);
    }
    if($('#comparison').value==='compare'&&entry.before?.zh_CN&&entry.before?.en)addPair(card,entry,'before',lang);
    else if(entry.review_scope==='related'&&!entry.before?.zh_CN)card.append(el('div','carried','新增验证视图，无对应首轮原图。'));
    addPair(card,entry,'after',lang);
    if(entry.review_scope==='accepted')card.append(el('div','carried','首轮未提意见，沿用通过。本图为当前版本复拍。'));
    const feedback=el('div','feedback'),select=el('select'),input=el('input');
    select.setAttribute('aria-label',entry.title+' 二次审阅状态');input.setAttribute('aria-label',entry.title+' 二次审阅意见');
    for(const [v,label]of [['pending','待二次审阅'],['pass','通过'],['changes','需调整']])select.add(new Option(label,v));
    select.value=notes[entry.id]?.status||(entry.review_scope==='accepted'?'pass':'pending');
    input.placeholder='填写二次意见，例如：留白仍需加大……';input.value=notes[entry.id]?.note||'';
    const update=()=>{notes[entry.id]={title:entry.title,status:select.value,note:input.value};save()};
    select.onchange=update;input.oninput=update;feedback.append(select,input);card.append(feedback);$('#items').append(card);
  }
  if(!filtered.length)$('#items').append(el('div','empty','没有匹配内容；可切换审阅范围或清空搜索。'));
  $('#page').textContent=`${page+1} / ${pages}`;$('#prev').disabled=page===0;$('#next').disabled=page>=pages-1;
}
for(const id of ['scope','category','comparison','language','search'])$('#'+id).addEventListener(id==='search'?'input':'change',()=>{page=0;render()});
$('#prev').onclick=()=>{page--;render();window.scrollTo(0,150)};$('#next').onclick=()=>{page++;render();window.scrollTo(0,150)};
for(const [id,value]of [['screensTab','screens'],['textTab','text']])$('#'+id).onclick=()=>{
  mode=value;page=0;for(const control of ['category','scope','comparison','language'])$('#'+control).disabled=mode==='text';
  $('#screensTab').classList.toggle('active',mode==='screens');$('#textTab').classList.toggle('active',mode==='text');render();
};
$('#zoomZh').onclick=()=>showZoom(zoomEntry,'zh_CN',zoomStage);$('#zoomEn').onclick=()=>showZoom(zoomEntry,'en',zoomStage);
$('#zoomBefore').onclick=()=>showZoom(zoomEntry,zoomLang,'before');$('#zoomAfter').onclick=()=>showZoom(zoomEntry,zoomLang,'after');
$('#closeZoom').onclick=()=>$('#zoom').close();$('#zoom').onclick=e=>{if(e.target===$('#zoom'))$('#zoom').close()};
$('#export').onclick=()=>{
  const blob=new Blob([JSON.stringify({round:2,exported:new Date().toISOString(),baseline_exported:data.review.exported,reviews:notes},null,2)],{type:'application/json'}),a=document.createElement('a');
  const url=URL.createObjectURL(blob);a.href=url;a.download='localization-review-notes-round2.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
};render();
</script></html>
