<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>哥布林教你地下城 · 中英文实机审阅</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;color:#e9e3cd;background:#0e1513}*{box-sizing:border-box}body{margin:0}header{padding:36px max(24px,4vw) 24px;border-bottom:1px solid #3c483d;background:linear-gradient(125deg,#26382c,#131b17)}small,.muted{color:#a6b5a6}h1{font-size:28px;letter-spacing:1px;margin:8px 0 14px}p{line-height:1.8;margin:5px 0}.badge{font-size:12px;color:#d9b676;letter-spacing:2px}.stats{display:flex;gap:28px;margin-top:20px}.stats b{font-size:26px;color:#e5c887;margin-right:6px}.toolbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;padding:14px max(24px,4vw);background:#14201bf5;border-bottom:1px solid #3d4a3d}button,select,input,textarea{font:inherit;color:inherit;background:#1e2d24;border:1px solid #54644e;border-radius:4px;padding:9px 12px}button{cursor:pointer}button:hover,button.active{background:#384b32;border-color:#c6aa69}input{flex:1;min-width:230px}main{padding:24px max(24px,4vw) 50px}.screen{margin:0 0 28px;background:#17211c;border:1px solid #394a39;border-radius:7px;overflow:hidden}.heading{padding:14px 18px;display:flex;gap:16px;justify-content:space-between;align-items:center}.heading h2{font-size:17px;margin:0}.heading small{font-size:11px;display:block;margin-top:4px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#526346}.pane{position:relative;background:#080d0b}.pane img{width:100%;display:block;cursor:zoom-in;aspect-ratio:16/9}.lang{position:absolute;left:12px;top:10px;background:#0d1713dc;border:1px solid #5b674e;border-radius:3px;padding:3px 8px;font-size:12px;color:#e7cc8e;pointer-events:none}.feedback{display:flex;gap:12px;padding:12px 18px}.feedback input{font-size:13px;min-width:100px}.feedback select{font-size:13px}.one .pair{grid-template-columns:1fr}.pager{display:flex;justify-content:center;gap:18px;align-items:center;padding:10px 0 25px}.empty{text-align:center;padding:55px}.textrow{display:grid;grid-template-columns:1fr 1fr;border:1px solid #394a39;margin-bottom:12px;border-radius:4px}.key{grid-column:1/-1;background:#25392a;padding:8px 14px;font:12px ui-monospace,monospace;color:#d9c08d}.copy{padding:14px;white-space:pre-wrap;line-height:1.65;font-size:14px;overflow-wrap:anywhere}.copy+.copy{border-left:1px solid #394a39}dialog{width:96vw;max-width:1500px;background:#0b100e;color:inherit;border:1px solid #819369;padding:12px}dialog::backdrop{background:#000d}dialog img{width:100%;display:block;max-height:82vh;object-fit:contain}dialog nav{display:flex;align-items:center;gap:12px;padding:10px}.grow{flex:1}.info{font-size:13px;color:#b6c1ad;margin-bottom:18px}@media(max-width:800px){.pair{grid-template-columns:1fr}.heading{align-items:flex-start}.feedback{flex-wrap:wrap}.textrow{grid-template-columns:1fr}.key{grid-column:auto}.copy+.copy{border-left:0;border-top:1px solid #394a39}h1{font-size:23px}.stats{gap:18px}.stats b{font-size:22px}}
</style>
<header><div class="badge">GOBLIN'S GUIDE TO DUNGEONS · LOCALIZATION REVIEW</div><h1>中英文实机截图审阅</h1>
<p>同一套正式游戏界面，分别以中文和英文运行。点击图片查看 1280 × 720 原图，可切换语言对照。</p>
<p class="muted">使用隔离的临时演示进度展示装备、借贷、挑战与结算状态。截图由 Godot 实际渲染，未修改你的存档。</p>
<div class="stats" id="stats"></div></header>
<div class="toolbar"><button id="screensTab" class="active">实机截图</button><button id="textTab">全部文案</button><select id="category"><option value="">全部类别</option></select><select id="language"><option value="both">中英文对照</option><option value="zh_CN">只看中文</option><option value="en">只看英文</option></select><input id="search" type="search" placeholder="搜索页面、物品、文案或 key"><button id="export">导出审阅意见</button></div>
<main><div class="info" id="info"></div><div id="items"></div><div class="pager"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div></main>
<dialog id="zoom"><nav><strong id="zoomTitle"></strong><span class="grow"></span><button id="zoomZh">中文</button><button id="zoomEn">English</button><button id="closeZoom">关闭 ×</button></nav><img id="zoomImg" alt="实机截图原图"></dialog>
<script type="application/json" id="data">__REVIEW_DATA__</script>
<script>
const data=JSON.parse(document.querySelector('#data').textContent),$=s=>document.querySelector(s),names={menus:'主菜单与设置',camp:'营地与天赋',battle:'战斗与背包',stats:'全部属性说明',bank:'银行与交易操作',trades:'哥布林交易、借贷与挑战',settlement:'结算',relics:'全部遗物',weapons:'全部武器',bonds:'全部羁绊',enchantments:'全部附魔'};
let mode='screens',page=0,filtered=[],zoomEntry=null,notes={};try{notes=JSON.parse(localStorage.getItem('goblin-localization-review')||'{}')}catch{}
const order=Object.keys(names);data.screens.sort((a,b)=>order.indexOf(a.category)-order.indexOf(b.category));
for(const key of order){const count=data.screens.filter(x=>x.category===key).length;if(count){const o=new Option(`${names[key]} (${count})`,key);$('#category').add(o)}}
$('#stats').innerHTML=`<span><b>${data.screens.length}</b>组对照</span><span><b>${data.screens.length*2}</b>张截图</span><span><b>${data.messages.length}</b>条中英文文案</span>`;
function save(){localStorage.setItem('goblin-localization-review',JSON.stringify(notes))}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function showZoom(entry,lang){zoomEntry=entry;$('#zoomTitle').textContent=entry.title+' · '+(lang==='en'?'English':'中文');$('#zoomImg').src=entry[lang].file;$('#zoomZh').classList.toggle('active',lang==='zh_CN');$('#zoomEn').classList.toggle('active',lang==='en');if(!$('#zoom').open)$('#zoom').showModal()}
function render(){const q=$('#search').value.toLowerCase(),cat=$('#category').value,lang=$('#language').value;filtered=(mode==='screens'?data.screens:data.messages).filter(e=>{if(mode==='screens'&&cat&&cat!==e.category)return false;return !q||JSON.stringify(e).toLowerCase().includes(q)});const size=mode==='screens'?12:40,pages=Math.max(1,Math.ceil(filtered.length/size));page=Math.min(page,pages-1);$('#items').replaceChildren();$('#info').textContent=mode==='screens'?`当前 ${filtered.length} 组。每组可标记“通过”或“需调整”并填写意见，意见保存在当前浏览器。`:`完整的 ${data.messages.length} 条翻译供检索与逐条审阅；数值和参数占位符保留原样。`;for(const entry of filtered.slice(page*size,(page+1)*size)){if(mode==='text'){const card=el('div','textrow');card.append(el('div','key',entry.keys),el('div','copy',entry.zh_CN),el('div','copy',entry.en));$('#items').append(card);continue}const card=el('article','screen'+(lang==='both'?'':' one')),head=el('div','heading'),title=el('div');title.append(el('h2','',entry.title),el('small','',entry.id));head.append(title,el('small','',names[entry.category]||entry.category));card.append(head);const pair=el('div','pair');for(const locale of (lang==='both'?['zh_CN','en']:[lang])){const pane=el('div','pane'),img=el('img');img.loading='lazy';img.src=entry[locale].thumbnail;img.alt=entry.title+' · '+locale;img.onclick=()=>showZoom(entry,locale);pane.append(img,el('span','lang',locale==='en'?'English':'中文'));pair.append(pane)}card.append(pair);const feedback=el('div','feedback'),select=el('select'),input=el('input');for(const [v,label]of [['pending','待审阅'],['pass','通过'],['changes','需调整']])select.add(new Option(label,v));select.value=notes[entry.id]?.status||'pending';input.placeholder='审阅意见，例如：英文说明换行、术语调整……';input.value=notes[entry.id]?.note||'';const update=()=>{notes[entry.id]={title:entry.title,status:select.value,note:input.value};save()};select.onchange=update;input.oninput=update;feedback.append(select,input);card.append(feedback);$('#items').append(card)}if(!filtered.length)$('#items').append(el('div','empty','没有匹配内容'));$('#page').textContent=`${page+1} / ${pages}`;$('#prev').disabled=page===0;$('#next').disabled=page>=pages-1}
for(const id of ['category','language','search'])$('#'+id).addEventListener(id==='search'?'input':'change',()=>{page=0;render()});
$('#prev').onclick=()=>{page--;render();window.scrollTo(0,150)};$('#next').onclick=()=>{page++;render();window.scrollTo(0,150)};
for(const [id,value]of [['screensTab','screens'],['textTab','text']])$('#'+id).onclick=()=>{mode=value;page=0;$('#category').disabled=mode==='text';$('#language').disabled=mode==='text';$('#screensTab').classList.toggle('active',mode==='screens');$('#textTab').classList.toggle('active',mode==='text');render()};
$('#zoomZh').onclick=()=>showZoom(zoomEntry,'zh_CN');$('#zoomEn').onclick=()=>showZoom(zoomEntry,'en');$('#closeZoom').onclick=()=>$('#zoom').close();$('#zoom').onclick=e=>{if(e.target===$('#zoom'))$('#zoom').close()};
$('#export').onclick=()=>{const blob=new Blob([JSON.stringify({exported:new Date().toISOString(),reviews:notes},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='localization-review-notes.json';a.click();URL.revokeObjectURL(a.href)};render();
</script></html>
