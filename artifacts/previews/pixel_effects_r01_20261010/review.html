<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>像素特效 · R01 审阅</title>
<style>
:root{color-scheme:dark;--bg:#101914;--panel:#19251e;--line:#354138;--text:#e7e9de;--muted:#a2b1a5;--gold:#dfc38b;--green:#c4d3c5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 'Microsoft YaHei',system-ui,sans-serif}button,select,input{font:inherit}button,select{color:inherit;background:#223027;border:1px solid #48574b;border-radius:4px;padding:8px 14px;cursor:pointer}button:hover{background:#304235}button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}header{padding:26px 36px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:20px}header small{color:var(--gold);letter-spacing:.16em;font-size:11px}h1{font-size:25px;margin:4px 0;font-weight:600;letter-spacing:.04em}header p{margin:0;color:var(--muted);font-size:13px}.badge{border:1px solid #5a5740;color:var(--gold);padding:7px 12px;font-size:12px;white-space:nowrap}main{max-width:1440px;margin:auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:26px;padding:26px 32px}nav{display:flex;flex-direction:column;gap:6px}nav p{margin:15px 8px 6px;color:var(--muted);font-size:11px;letter-spacing:.12em}nav button{display:flex;text-align:left;align-items:center;gap:10px;width:100%;border-color:transparent;background:transparent;padding:12px 10px;font-size:13px}nav button span{font:11px ui-monospace,monospace;color:#91a092}nav button.active{background:#28382c;border-color:#70816b;color:#f0e2bb}article{min-width:0}h2{font-size:23px;margin:0 0 6px;font-weight:550}#description{color:#c9d2c7;margin:0 0 18px;max-width:850px}.viewer{border:1px solid var(--line);background:#142018}.views{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}.view{min-width:0;background:#17241c}.label{padding:10px 16px;display:flex;justify-content:space-between;color:var(--muted);font-size:12px;letter-spacing:.06em}.label strong{font-weight:500;color:var(--gold)}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;aspect-ratio:440/320;background:#1f2d23}#loading{padding:6px 16px;color:var(--gold);font-size:12px;min-height:26px}.tools{padding:14px 16px 16px}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:9px}.primary{background:var(--gold);color:#212a1e;border-color:var(--gold);min-width:88px}.primary:hover{background:#ecd6a6}.speed{margin-left:auto;display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12px}select{padding:7px 10px}.timeline{display:flex;align-items:center;gap:15px;margin-top:15px}input[type=range]{width:100%;accent-color:var(--gold);cursor:pointer}#counter{white-space:nowrap;min-width:160px;text-align:right;font:12px ui-monospace,monospace;color:var(--muted)}.details{margin:14px 0 0;padding:13px 16px;border-left:2px solid #707a61;color:#becbbd;background:#17241d;font-size:13px}.meta{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:17px 0;color:var(--muted);font-size:12px}.meta a{color:var(--gold);text-decoration:none}footer{max-width:1440px;margin:0 auto;padding:0 32px 26px 278px;color:#829486;font-size:12px}#lampOnly{display:none;padding:5px 16px;color:var(--muted);font-size:12px}@media(max-width:1000px){header{padding:20px}main{padding:20px;grid-template-columns:180px minmax(0,1fr);gap:16px}footer{padding-left:216px}.views{grid-template-columns:1fr}.view canvas{max-height:380px;object-fit:contain}.speed{margin-left:0}}@media(max-width:650px){header{display:block}.badge{display:inline-block;margin-top:12px}main{display:block}nav{display:grid;grid-template-columns:1fr 1fr;margin-bottom:22px}nav p{grid-column:1/-1}nav button{padding:7px}footer{padding:0 20px 25px}.timeline{flex-wrap:wrap}#counter{text-align:left}}
</style>
<header><div><small>COMBAT EFFECTS / REVIEW 01</small><h1>像素特效 · 第一版</h1><p>在真实地面和角色旁，比较色块、轮廓与动作节奏。</p></div><div class="badge">全部已采用 · 对照存档</div></header>
<main><nav aria-label="特效选择" id="nav"></nav><article>
<h2 id="title"></h2><p id="description"></p>
<section class="viewer" aria-label="动态对照">
<div class="views"><div class="view"><div class="label"><span id="leftLabel">替换前版本</span><span>相同帧进度</span></div><canvas id="before" width="440" height="320" aria-label="替换前版本动画"></canvas></div><div class="view"><div class="label"><strong id="rightLabel">已采用 R01</strong><span>最近邻显示</span></div><canvas id="after" width="440" height="320" aria-label="已采用 R01 动画"></canvas></div></div>
<div id="loading" role="status">载入画面…</div><button id="retry" hidden style="margin:0 16px 12px">重新加载画面</button><div id="lampOnly">此项两侧均为正式炉灯，用来对照色块组织与分帧节奏。</div>
<div class="tools"><div class="controls"><button id="play" class="primary">暂停</button><button id="prev" aria-label="上一帧">← 上一帧</button><button id="next" aria-label="下一帧">下一帧 →</button><label class="speed">速度 <select id="speed"><option value="1">1× 原速</option><option value="0.5">0.5× 慢放</option><option value="0.25">0.25× 慢放</option></select></label><button id="zoom">放大 2×</button></div>
<div class="timeline"><input id="scrub" type="range" min="0" max="9" value="0" aria-label="逐帧进度"><output id="counter"></output></div></div></section>
<p class="details" id="note"></p><div class="meta"><span id="stats"></span><a id="atlas" href="#" target="_blank">查看透明图集 ↗</a></div>
</article></main>
<footer>空格：播放 / 暂停　← →：逐帧　·　画面来自 Godot 的受控采样；此页用于审阅外观，未模拟完整战斗或命中结算。</footer>
<script src="review-data.js"></script>
<script>
const $=id=>document.getElementById(id), data=window.REVIEW_DATA, cache=new Map();
const contexts=[$('before').getContext('2d'),$('after').getContext('2d')];
let chosen=data[0], pair=[], bg=null, playing=true, zoom=1, phase=0, frame=0, speed=1, stamp=0, generation=0, loading=false;
function loadImage(src){if(!cache.has(src)){const pending=new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(Error(src));im.src=src});cache.set(src,pending);pending.catch(()=>{if(cache.get(src)===pending)cache.delete(src)})}return cache.get(src)}
function focusPoint(){if(chosen.id==='star_anchor')return [320,160];if(chosen.id==='wind_blade')return [280,160];if(chosen.id==='flail_trail'){const age=(frame+.5)/30,u=Math.max(0,Math.min(1,(age-.13)/.37)),a=(-65+130*u*u*(3-2*u))*Math.PI/180;return [220+Math.cos(a)*120,160+Math.sin(a)*120]}return [220,160]}
function draw(){if(!pair.length)return;const duration=chosen.frames/chosen.fps, resting=!chosen.loop&&phase>=duration;contexts.forEach((ctx,j)=>{ctx.imageSmoothingEnabled=false;let fx=0,fy=0,sw=440,sh=320;if(zoom===2){const p=focusPoint();sw=220;sh=160;fx=Math.max(0,Math.min(440-sw,p[0]-sw/2));fy=Math.max(0,Math.min(320-sh,p[1]-sh/2))}if(resting&&bg)ctx.drawImage(bg,fx,fy,sw,sh,0,0,440,320);else ctx.drawImage(pair[j],frame*440+fx,fy,sw,sh,0,0,440,320)});$('scrub').value=frame;$('counter').textContent=resting?'循环间隔':`${String(frame+1).padStart(2,'0')} / ${chosen.frames} · ${Math.round(frame/chosen.fps*1000)} ms`}
async function choose(item){chosen=item;const token=++generation;phase=0;frame=0;loading=true;pair=[];$('retry').hidden=true;$('title').textContent=item.title;$('description').textContent=item.description;$('note').textContent=item.note;$('scrub').max=item.frames-1;$('stats').textContent=`${item.frames} 帧 · ${(item.frames/item.fps).toFixed(2)} 秒${item.loop?' · 循环':''}`;$('atlas').href=`candidate/${item.id}.png`;$('atlas').style.display=item.id==='lamp_reference'?'none':'';$('lampOnly').style.display=item.id==='lamp_reference'?'block':'none';$('leftLabel').textContent=item.id==='lamp_reference'?'正式炉灯':'替换前版本';$('rightLabel').textContent=item.id==='lamp_reference'?'风格参考':'已采用 R01';for(const b of document.querySelectorAll('nav button')){b.classList.toggle('active',b.dataset.id===item.id);b.setAttribute('aria-pressed',b.dataset.id===item.id)}$('loading').textContent='载入画面…';try{const paths=item.id==='lamp_reference'?['renders/lamp_reference.webp','renders/lamp_reference.webp']:[`renders/${item.id}_baseline.webp`,`renders/${item.id}_candidate.webp`];const images=await Promise.all(paths.map(loadImage));if(token!==generation)return;pair=images;loading=false;$('loading').textContent=item.loop?'连续循环；可暂停逐帧查看':'每次动作结束留有短暂停顿';draw()}catch(e){if(token===generation){loading=false;$('loading').textContent='画面暂时无法加载，请点击重新加载。';$('retry').hidden=false;console.warn('Review image unavailable:',e.message)}}}
let group='';data.forEach((item,i)=>{if(item.priority!==group){group=item.priority;const p=document.createElement('p');p.textContent=group==='高'?'第一批 · 核心特效':group==='中'?'第二批 · 残影与拖影':'保持风格参考';$('nav').append(p)}const b=document.createElement('button');b.dataset.id=item.id;const n=document.createElement('span');n.textContent=String(i+1).padStart(2,'0');b.append(n,document.createTextNode(item.title.replace('突进短刃 · ','突进 · ')));b.onclick=()=>choose(item);$('nav').append(b)});
function setPlaying(value){playing=value;$('play').textContent=value?'暂停':'播放'}
function step(delta){setPlaying(false);frame=(frame+delta+chosen.frames)%chosen.frames;phase=frame/chosen.fps;draw()}
$('play').onclick=()=>setPlaying(!playing);$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('speed').onchange=e=>speed=Number(e.target.value);$('zoom').onclick=()=>{zoom=zoom===1?2:1;$('zoom').textContent=zoom===1?'放大 2×':'恢复 1×';draw()};$('scrub').oninput=e=>{setPlaying(false);frame=Number(e.target.value);phase=frame/chosen.fps;draw()};document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();setPlaying(!playing)}if(e.code==='ArrowLeft'){e.preventDefault();step(-1)}if(e.code==='ArrowRight'){e.preventDefault();step(1)}});
function tick(now){const dt=Math.min(.08,(now-stamp)/1000);stamp=now;if(playing&&!loading&&pair.length){phase=(phase+dt*speed)%(chosen.frames/chosen.fps+(chosen.loop?0:.55));frame=Math.min(chosen.frames-1,Math.floor(phase*chosen.fps));draw()}requestAnimationFrame(tick)}
function loadBackground(){if(!bg)loadImage('renders/background.png').then(im=>{bg=im;draw()}).catch(e=>console.warn('Review background unavailable:',e.message))}
$('retry').onclick=()=>{loadBackground();choose(chosen)};loadBackground();choose(data[0]);requestAnimationFrame(tick);
</script></html>
