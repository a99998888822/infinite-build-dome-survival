<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>R02 · 命中反馈与触发节奏</title>
<style>
:root{color-scheme:dark;font:15px/1.6 'Microsoft YaHei',system-ui;background:#111c18;color:#e0e8df}*{box-sizing:border-box}body{margin:0}header{padding:28px 32px 24px;border-bottom:1px solid #3a4940;display:flex;justify-content:space-between;gap:24px;align-items:center}small{color:#d5c291;letter-spacing:.12em}h1{font-size:26px;margin:5px 0}p{margin:5px 0;color:#aabcb1}.badge{padding:8px 14px;border:1px solid #796e4b;color:#e4d5aa;white-space:nowrap}main{display:grid;grid-template-columns:204px minmax(0,1fr);gap:26px;max-width:1600px;padding:26px 30px;margin:auto}nav{display:flex;flex-direction:column;gap:8px}button,select{font:inherit;color:inherit;background:#24352b;border:1px solid #496050;padding:9px 12px;cursor:pointer}button:hover{background:#354c3e}nav button{text-align:left;background:transparent;border-color:transparent;font-size:14px}nav button[aria-pressed=true]{background:#2b4033;border-color:#87987c;color:#ebddaf}button:focus-visible,select:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #e4d5aa;outline-offset:3px}article{min-width:0}h2{margin:0 0 8px;font-size:22px}#note{min-height:52px;margin-bottom:18px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#44574a;border:1px solid #44574a}.view{min-width:0;background:#17221f}.label{padding:10px 15px;color:#a6baab;font-size:13px}.label strong{color:#e4d5aa;font-weight:500}canvas{display:block;width:100%;height:auto;image-rendering:pixelated}.controls{display:flex;gap:10px;flex-wrap:wrap;padding:16px 0;align-items:center}.primary{background:#dfcfa2;color:#15251c}select{padding:8px}#scrub{width:100%;accent-color:#dfcfa2}.timeline{display:flex;align-items:center;gap:18px}#counter{white-space:nowrap;font:13px monospace}#status{font-size:13px;margin:10px 0;color:#cdbd91}.links{display:flex;gap:24px;flex-wrap:wrap;margin-top:18px}a{color:#e4d5aa}footer{border-top:1px solid #34473b;padding:22px 30px;color:#97aa9b;max-width:1600px;margin:auto;font-size:13px}.expanded main{grid-template-columns:1fr}.expanded nav{flex-direction:row;flex-wrap:wrap}.expanded .pair{grid-template-columns:1fr}.expanded canvas{max-width:1240px}audio{width:240px;height:32px;vertical-align:middle;margin-left:12px}@media(max-width:1080px){.pair{grid-template-columns:1fr}main{grid-template-columns:170px minmax(0,1fr);gap:16px;padding:20px}header{padding:20px}}@media(max-width:640px){header{display:block}.badge{display:inline-block;margin-top:12px}main{display:block}nav{display:grid;grid-template-columns:1fr 1fr;margin-bottom:22px}h1{font-size:23px}}
</style>
<header><div><small>COMBAT FEEDBACK / R02</small><h1>命中有轻重，触发有节拍</h1><p>真实场景 · 同帧对照 · 六组动图</p></div><div class="badge">已正式启用 · 对照存档</div></header>
<main><nav id="nav" aria-label="场景选择"></nav><article><h2 id="title"></h2><p id="note"></p>
<div class="pair"><div class="view"><div class="label">替换前版本</div><canvas id="before" width="620" height="440" aria-label="替换前版本动画"></canvas></div><div class="view"><div class="label"><strong>已采用 R02</strong></div><canvas id="after" width="620" height="440" aria-label="已采用 R02 动画"></canvas></div></div>
<div id="status" role="status">载入画面…</div><button id="retry" hidden>重新加载画面</button>
<div class="controls"><button class="primary" id="play">暂停</button><button id="prev">← 上一帧</button><button id="next">下一帧 →</button><label>速度 <select id="speed"><option value="1">1× 原速</option><option value="0.5">0.5× 慢放</option><option value="0.25">0.25× 慢放</option></select></label><button id="zoom">放大查看</button></div>
<div class="timeline"><input id="scrub" type="range" min="0" value="0" aria-label="逐帧进度"><output id="counter"></output></div>
<div class="links"><a id="gif" href="#" target="_blank">打开对照 GIF ↗</a><a href="README.md">实现与验证记录 ↗</a></div>
</article></main>
<footer>空格播放／暂停，左右方向键逐帧。目标固定位置与高血量便于对照；命中来自正式武器与碰撞查询。画面下方为真实武器栏截取。GIF 不含声音；页面逐帧播放使用无损画面。<p>秘仪点名短音试听（单音素材，非实机混音录音）：<audio controls preload="none" src="ritual_mark_preview.wav"></audio></p></footer>
<script src="review-data.js"></script><script>
const $=id=>document.getElementById(id),data=window.REVIEW_DATA,cache=new Map();
const ctx=[$('before').getContext('2d'),$('after').getContext('2d')];ctx.forEach(c=>c.imageSmoothingEnabled=false);
let chosen,images=[],frame=0,phase=0,playing=true,loading=true,generation=0,last=0;
function load(path){if(!cache.has(path)){const p=new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(Error(path));im.src=path}).catch(e=>{cache.delete(path);throw e});cache.set(path,p)}return cache.get(path)}
async function choose(item){chosen=item;const token=++generation;frame=0;phase=0;loading=true;images=[];$('retry').hidden=true;$('status').textContent='载入画面…';$('title').textContent=item.title;$('note').textContent=item.note;$('scrub').max=item.frames-1;$('gif').href=`renders/${item.id}_comparison.gif`;for(const b of document.querySelectorAll('nav button'))b.setAttribute('aria-pressed',b.dataset.id===item.id);try{const paths=['before','r02'].map(v=>Array.from({length:item.chunks},(_,i)=>`renders/${item.id}_${v}_${i}.webp`));const result=await Promise.all(paths.map(p=>Promise.all(p.map(load))));if(token!==generation)return;images=result;loading=false;$('status').textContent='每次动作结束留有短暂停顿；可暂停逐帧查看。';draw()}catch(e){if(token!==generation)return;loading=false;$('status').textContent='画面暂时无法加载，请点击重新加载。';$('retry').hidden=false}}
function draw(){if(!chosen)return;$('scrub').value=frame;$('counter').textContent=`${String(frame+1).padStart(2,'0')} / ${chosen.frames} · ${(frame/30).toFixed(2)} s`;if(!images.length)return;for(let i=0;i<2;i++){ctx[i].clearRect(0,0,620,440);ctx[i].drawImage(images[i][Math.floor(frame/24)],(frame%24)*620,0,620,440,0,0,620,440)}}
function setPlay(value){playing=value;$('play').textContent=value?'暂停':'播放'}
function step(n){setPlay(false);frame=Math.max(0,Math.min(chosen.frames-1,frame+n));phase=frame/30;draw()}
for(const item of data){const b=document.createElement('button');b.textContent=item.title;b.dataset.id=item.id;b.onclick=()=>choose(item);$('nav').append(b)}
$('play').onclick=()=>setPlay(!playing);$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('scrub').oninput=()=>{setPlay(false);frame=Number($('scrub').value);phase=frame/30;draw()};$('retry').onclick=()=>choose(chosen);$('zoom').onclick=()=>{$('zoom').textContent=document.body.classList.toggle('expanded')?'恢复布局':'放大查看'};
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON','AUDIO'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();setPlay(!playing)}else if(e.code==='ArrowRight'){e.preventDefault();step(1)}else if(e.code==='ArrowLeft'){e.preventDefault();step(-1)}});
function animate(now){const dt=Math.min((now-last)/1000,.1);last=now;if(playing&&!loading&&images.length){phase=(phase+dt*Number($('speed').value))%(chosen.frames/30+.5);frame=Math.min(chosen.frames-1,Math.floor(phase*30));draw()}requestAnimationFrame(animate)}choose(data[0]);requestAnimationFrame(animate);
</script></html>
