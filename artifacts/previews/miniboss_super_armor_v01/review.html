<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>霸体 · 钢甲骑士视觉审阅</title>
<style>
@font-face{font-family:ark;src:url('sandbox/reference/chinese.otf')}
:root{color-scheme:dark;--bg:#0b100f;--panel:#121a17;--border:#29392f;--muted:#92a199;--gold:#e2cc84}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#e6ebdf;font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif}
main{max-width:1024px;margin:36px auto 56px;padding:0 24px}header{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:24px}
.eyebrow{color:var(--gold);font:12px/1.6 ui-monospace,monospace;letter-spacing:2px}h1{font-size:30px;font-weight:560;letter-spacing:2px;margin:8px 0}p{margin:0;color:var(--muted)}.badge{padding:5px 12px;border:1px solid var(--border);border-radius:30px;color:#bac8bd;white-space:nowrap;font-size:12px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}button,select{font:inherit;border:1px solid var(--border);background:var(--panel);color:#c1cec4;border-radius:6px;padding:6px 14px;cursor:pointer}button:hover,button[aria-pressed=true]{border-color:#bdac72;color:#f1db95;background:#242719}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #ffe369;outline-offset:3px}.spacer{flex:1}
.screen{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#0b100f}video{display:block;width:100%;image-rendering:pixelated}.transport{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--panel)}input[type=range]{flex:1;min-width:50px;accent-color:var(--gold)}output{font:12px ui-monospace,monospace;white-space:nowrap;color:var(--muted)}.notes{display:flex;gap:24px;flex-wrap:wrap;color:var(--muted);font-size:13px;padding:14px 2px 30px}.notes b{color:#e0d4a6;font-weight:500}
.stills{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.still{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--panel)}.still img{display:block;width:100%;image-rendering:pixelated}.still div{padding:12px 14px}.still strong{font-size:14px;font-weight:500}.still p{font-size:12px;margin-top:4px}.section-title{font-size:15px;color:#c9d4c8;font-weight:500;margin:0 0 12px}.foot{margin-top:24px;font-size:12px;color:#75887b}a{color:#deca89;text-underline-offset:3px}
@media(max-width:620px){main{margin:20px auto;padding:0 14px}h1{font-size:24px}header{gap:8px}.badge{display:none}.stills{grid-template-columns:1fr}.still{display:grid;grid-template-columns:1fr 1fr;align-items:center}.notes{gap:8px 18px}.transport{gap:6px;padding:10px}.transport button{padding:5px 9px}}
</style>
<main>
<header><div><div class="eyebrow">IRON KNIGHT / VISUAL STUDY 02</div><h1>霸体 · 黄橙红流光</h1><p>暖色描边加速流动，黄色提示缩小至 0.7 倍。</p></div><span class="badge">独立视觉稿 · 待审阅</span></header>
<div class="toolbar" aria-label="动画姿态">
<button data-pose="idle" aria-pressed="true">站立</button><button data-pose="move" aria-pressed="false">移动</button><button data-pose="mirrored" aria-pressed="false">转向与蓄力</button>
<span class="spacer"></span><label for="speed">播放速度 </label><select id="speed"><option value="1">1× 正常</option><option value="0.5">0.5× 慢放</option><option value="0.25">0.25× 细看</option></select>
</div>
<section class="screen" aria-label="霸体动画预览">
<video id="preview" poster="poster_v02.png" autoplay muted loop playsinline preload="auto" aria-label="左侧实战尺寸，右侧两倍放大的霸体动画"></video>
<div class="transport"><button id="play">暂停</button><button id="restart">重播</button><input id="seek" type="range" min="0" max="2.8" step="0.01" value="0" aria-label="动画时间"><output id="time">0.00 / 2.80 秒</output></div>
</section>
<div class="notes"><span>霸体持续 <b>2 秒</b></span><span>字体 <b>0.7 倍</b> · 流速 <b>4 倍</b></span><span>文字上升、淡出 <b>0.8 秒</b></span><span>左侧 <b>实战尺寸</b> / 右侧 <b>2 倍放大</b></span></div>
<h2 class="section-title">触发过程</h2>
<section class="stills">
<article class="still"><img src="trigger_v02.png" alt="缩小到零点七倍的黄色霸体文字在脚部出现"><div><strong>01 · 脚部出现</strong><p>字体缩小至 0.7 倍，保持水平居中。</p></div></article>
<article class="still"><img src="rise_v02.png" alt="黄色霸体文字向身体中央升起并开始淡出"><div><strong>02 · 上升淡出</strong><p>沿身体中轴上移，逐渐变透明。</p></div></article>
<article class="still"><img src="flow_v02.png" alt="文字消失后，黄橙红描边继续环绕角色"><div><strong>03 · 描边持续</strong><p>黄橙红加速流动，霸体 2 秒后结束。</p></div></article>
</section>
<p class="foot">使用当前钢甲骑士素材，在独立 Godot 预览工程中渲染。正式资源与战斗逻辑未接入此效果。<a href="armor_preview_v02.gif" target="_blank">查看动图</a></p>
</main>
<script>
const video=document.querySelector('#preview'),play=document.querySelector('#play'),seek=document.querySelector('#seek'),time=document.querySelector('#time'),speed=document.querySelector('#speed');
const sync=()=>{seek.value=video.currentTime;time.textContent=`${video.currentTime.toFixed(2)} / 2.80 秒`;play.textContent=video.paused?'播放':'暂停'};
video.addEventListener('timeupdate',sync);video.addEventListener('play',sync);video.addEventListener('pause',sync);
play.onclick=()=>video.paused?video.play():video.pause();
document.querySelector('#restart').onclick=()=>{video.currentTime=0;video.play()};
seek.addEventListener('input',()=>{video.pause();video.currentTime=Number(seek.value);sync()});
speed.onchange=()=>video.playbackRate=Number(speed.value);
let activeBlob=null,loadVersion=0;
async function loadPose(pose){
  const version=++loadVersion;
  const response=await fetch(pose+'_v02.mp4');
  if(!response.ok)throw new Error('Preview media failed to load');
  const blob=await response.blob();
  if(version!==loadVersion)return;
  const oldBlob=activeBlob;
  activeBlob=URL.createObjectURL(blob);
  video.src=activeBlob;
  video.playbackRate=Number(speed.value);
  if(oldBlob)URL.revokeObjectURL(oldBlob);
  await video.play();
}
document.querySelectorAll('[data-pose]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-pose]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));loadPose(button.dataset.pose)});
loadPose('idle');
</script>
</html>
